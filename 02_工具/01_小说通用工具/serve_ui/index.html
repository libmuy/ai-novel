<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审查台</title>
<link rel="stylesheet" href="/nocturne.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  html,body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:var(--color-accent-300);text-decoration:none}
  a:hover{color:var(--color-accent-200)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="app"></div>
<!-- 迷你播放器与音频元素常驻此处，刻意放在 #app 之外：
     render() 只清空 #app，切章/切区/任务轮询都不会销毁正在播放的音频。 -->
<div id="miniplayer" class="miniplayer" hidden></div>
<audio id="player-audio" preload="metadata"></audio>
<script src="/app.js"></script>
</body>
</html>
