# 规则层审计配置（audit_rules.py）。
#
# `audit_consistency.py` 审的是**小说数据**（01_小说数据/<书>/）；本配置对应的
# `audit_rules.py` 审的是**规则层自身**（00_通用模板/ + AGENTS.md + README.md）——
# 见 `00_通用模板/00_系统架构规范.md` §二·A【规则层自身也适用本原则】。
#
# 按 churn 统计，规则层才是本仓最不稳定的部分（00_使用说明 70 次改动、
# 00_云端提示词生成器 49 次、AGENTS.md 41 次、99_速查手册 35 次），此前却没有
# 任何确定性检查。

[scope]
# 参与审计的规则层根（相对仓库根）
roots = ["00_通用模板", "AGENTS.md", "README.md", "CLAUDE.md"]
# 骨架模板是「新书蓝本」，里面的路径是给未来的书用的，不参与死链检查
exclude = ["00_通用模板/05_项目骨架模板"]

[ref]
# RULE001 死链检查：反引号里的 `xxx.md` 引用必须能解析到实际文件。
# 含以下片段的引用视为占位符/通配，跳过。
placeholder_markers = [
  "《", "》", "<", ">", "{", "}", "*", "XX", "NN", "_修订N", "卷N", "N.md",
  # 模板里的示例专名占位（世界A/区域B/地名C、人物_姓名、物品_名称…）
  "世界A", "区域B", "地名C", "_姓名", "_名称", "甲&乙", "_主角", "当前状态",
  # 事件卡 ID 是示例（BT-V1-001 之类），不是实有文件
  "BT-V", "BP-V", "EV-",
]
# 「按条件才创建」的文件：文档里写了它的用法，但只有触发条件出现时才落地。
conditional = [
  "02_数据库/04_资源/04_资源_原创.md",
  "04_资源_原创.md",
]
# 已废止的旧文件名：文档里点名提它，是为了写明「它没有了」（"不再产出 xxx"）。
# 不是死链，但也别删——写明废止本身有价值。
historical = [
  "03_本章初始状态.md",
  "03_本章开篇状态.md",
]

[index]
# RULE002 计数漂移：99_速查手册 里「（N 个）」式声明 → 实际目录文件数
[[index.declared_counts]]
file = "00_通用模板/99_速查手册.md"
pattern = "卡片模板（(\\d+) 个）"
dir = "00_通用模板/02_卡片模板"

[[index.declared_counts]]
file = "00_通用模板/99_速查手册.md"
pattern = "写作规则（(\\d+) 个）"
dir = "00_通用模板/01_写作规则"

[[index.declared_counts]]
file = "00_通用模板/99_速查手册.md"
pattern = "提示词生成器（(\\d+) 个）"
dir = "00_通用模板/04_提示词"

[skill]
# RULE003 技能索引 ↔ 技能文件双向一致
[[skill.indexes]]
index = "00_通用模板/03_任务技能/01_系统级/index.md"
dir = "00_通用模板/03_任务技能/01_系统级"

[[skill.indexes]]
index = "00_通用模板/03_任务技能/02_小说级/index.md"
dir = "00_通用模板/03_任务技能/02_小说级"

[derived]
# RULE004 派生切片漂移：切片的每个小节标题必须在权威版里有对应节，
# 否则说明切片里长出了权威版没有的规则（切片是有损压缩，只许少、不许多）。
[[derived.slices]]
authority = "00_通用模板/01_写作规则/00_通用写作规则.md"
slice = "00_通用模板/01_写作规则/00_通用写作规则_生成版.md"

[[derived.slices]]
authority = "00_通用模板/01_写作规则/00_通用写作规则.md"
slice = "00_通用模板/01_写作规则/00_通用写作规则_校验版.md"

[authority]
# RULE005 权威位置表：架构规范 §二·A 两张表里点名的权威文件必须存在
table_file = "00_通用模板/00_系统架构规范.md"

[duplicate]
# RULE006 跨文件逐字重复的规范正文——§二·A 说的正是这个病根：
# 「一个事实被复制成多份，没有任何机制强制它们一致。」
min_length = 25
# 同一「豁免组」内部的重复不报（组内文件本就是并列/派生关系）：
exempt_groups = [
  # 通用写作规则家族：全量权威版 + 两份声明过的人工派生切片
  ["00_通用模板/01_写作规则/00_通用写作规则.md",
   "00_通用模板/01_写作规则/00_通用写作规则_生成版.md",
   "00_通用模板/01_写作规则/00_通用写作规则_校验版.md"],
  # 四份文风模板是并列同构的，共享同一段「叠加于通用写作规则之上」的边界声明
  ["00_通用模板/01_写作规则/00_文风_底层成长流.md",
   "00_通用模板/01_写作规则/00_文风_天骄崛起流.md",
   "00_通用模板/01_写作规则/00_文风_沉重宿命流.md",
   "00_通用模板/01_写作规则/00_文风_轻松诙谐流.md",
   "00_通用模板/01_写作规则/00_文风索引.md"],
  # 主角卡与配角卡是同构的两张人物表，共享一批同名字段行（"主角与配角本质区别"
  # 见 00_主角人设卡模板 抬头）；字段行同文是设计如此，不是复制粘贴规则正文
  ["00_通用模板/02_卡片模板/00_主角人设卡模板.md",
   "00_通用模板/02_卡片模板/04_人物模板.md"],
]
# 行首前缀豁免：文件抬头的同构「类型声明」不是规范正文
exempt_prefixes = [
  "类型：写作规则 · 行为约束",
  "类型：卡片模板 ·",
]
# 逐条豁免：确实需要在两处出现的句子（写清理由再加，别拿它当消音器）
exempt_sentences = [
  # 各写作规则文件开头的同构「类型声明」抬头，不是规范正文
  "类型：写作规则 · 行为约束/规范，生成与续写时遵循，不产生独立数据文件",
  "python3 02_工具/00_系统级/new_novel.py <小说名>",
  "python3 02_工具/00_系统级/new_novel.py <小说名>          # 先 --dry-run 看编号与计划",
  "python3 02_工具/01_小说通用工具/audit_consistency.py <小说目录> --format text",
]

[tool_path]
# RULE007 工具里硬编码的小说数据路径，必须在骨架模板里存在。
# 抓到过真实缺陷：白名单文件从 00_ 改名为 03_，骨架与文档都改了，
# 规则代码里的常量没改 → 白名单静默失效。
tool_roots = ["02_工具/00_系统级", "02_工具/01_小说通用工具"]
skeleton = "00_通用模板/05_项目骨架模板"
exclude = ["99_一次性脚本_归档", "__pycache__", ".venv", "tests"]
# 骨架里按需才创建、不预建的路径
allow_missing = [
  "05_工作区/02_状态/00_基线候选",
  "05_工作区/02_状态/04_描述合并缓存.jsonl",
  "05_工作区/02_状态/01_最新状态/00_持有物品反查.md",
]
